# Local PostgreSQL for ReplayLab history. Start: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: replaylab
      POSTGRES_PASSWORD: replaylab # local dev only
      POSTGRES_DB: replaylab
    ports:
      - "5433:5432" # host 5433 avoids clashing with any locally installed Postgres on 5432
    volumes:
      - replaylab-pgdata:/var/lib/postgresql/data # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replaylab -d replaylab"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  replaylab-pgdata:
